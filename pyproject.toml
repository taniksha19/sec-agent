[project]
name = "sec-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Each top-level folder under src/ is its own package (matches plan.md layout).
# Add new packages here as they are created.
[tool.hatch.build.targets.wheel]
packages = ["src/ingest", "src/retrieval", "src/agent", "src/llm_gateway", "src/tools", "src/api", "src/mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long HTML lines verbatim.
"tests/**" = ["E501"]
