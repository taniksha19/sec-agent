name: sec-agent  # fixed project name so the volume is always sec-agent_qdrant_data

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      # Localhost only: Qdrant has no API key, and anyone who can write to it can plant chunks.
      - "127.0.0.1:6333:6333" # REST
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    # Only what the API reads, not all of .env (compose fills ${...} from .env).
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
    ports:
      # Localhost only: auth and rate limits arrive with the Go gateway.
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
